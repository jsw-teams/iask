name: Deploy iAsk to JS.GRIPE
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: js-gripe-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: jsw-teams/web
          path: .website-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .website-source/js.gripe/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: .website-source/js.gripe
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm test
        working-directory: .website-source/js.gripe
      - run: npm run build:production -- --website-source .website-source/js.gripe
      - run: npx wrangler deploy --config backend/cloudflare/wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
