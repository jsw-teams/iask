name: Refresh audited lockfile on repair branch
on:
  push:
    branches: [fix/actions-audit-20261031]
    paths: ['.github/workflows/dependency-lock-refresh.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/actions-audit-20261031' && github.repository_owner == 'jsw-teams'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Regenerate exact dependency lockfile with patched transitive versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Retain high-severity security gate
        run: npm audit --package-lock-only --audit-level=high
      - name: Check reproducible dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only to the dedicated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): refresh audited package lockfile"
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/actions-audit-20261031
