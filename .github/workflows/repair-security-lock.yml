name: One-time lockfile security repair
on:
  push:
    branches: [fix/security-audit-20261031]
    paths: ['.github/workflows/repair-security-lock.yml']
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'jsw-teams/iask' && github.ref == 'refs/heads/fix/security-audit-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Re-resolve overridden dependencies and retain strict audit
        shell: bash
        run: |
          set -euo pipefail
          (cd . && npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm audit --package-lock-only --audit-level=high)
          git diff --check
      - name: Commit regenerated locks to repair branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- package-lock.json
          if git diff --cached --quiet; then echo 'No lockfile update needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): refresh lockfiles with security-patched versions'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/security-audit-20261031
